repos:
  - repo: local
    hooks:
      - id: install-frontend
        name: install frontend
        entry: npm install
        language: system
        files: (\.(m?js|ts)|^package(-lock)?\.json)$
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.39.1
    hooks:
      - id: eslint
        args: [--fix]
        types: [file]
        files: \.(m?js|ts)$
        exclude: ^octoprint_prettygcode/static/js/pg-main\.bundle\.js$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: [--target-version=py37]
      - id: ruff-format

  - repo: https://github.com/djlint/djLint
    rev: v1.39.2
    hooks:
      - id: djlint-reformat-jinja
      - id: djlint-jinja

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies:
        - tomli

  - repo: local
    hooks:
      - id: build-frontend
        name: build frontend
        entry: npm run build
        language: system
        files: ^(frontend/|package(-lock)?\.json|octoprint_prettygcode/static/js/pg-main\.bundle\.js)
        pass_filenames: false
